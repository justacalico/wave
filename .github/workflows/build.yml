name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      build_all:
        type: boolean
        default: true
        description: 'Build all targets'
      create_release:
        type: boolean
        default: false
        description: 'Create a versioned release'
      merge_request_id:
        type: string
        required: false
        default: ''
      merge_request_url:
        type: string
        required: false
        default: ''

permissions:
  contents: write
  actions: read

env:
  FLUTTER_VERSION: '3.44.6'
  MERGE_REQUEST_ID: ${{ inputs.merge_request_id }}
  MERGE_REQUEST_URL: ${{ inputs.merge_request_url }}

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup build metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build_number: ${{ steps.meta.outputs.build_number }}
      build_date: ${{ steps.meta.outputs.build_date }}
      build_all: ${{ steps.meta.outputs.build_all }}
      targets: ${{ steps.meta.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read version and build metadata
        id: meta
        run: |
          VERSION=$(sed -n 's/^version: \([0-9.]*\).*/\1/p' pubspec.yaml | head -1)
          BUILD_NUMBER=$(date +%s | cut -c4-10)
          BUILD_DATE=$(date +%Y-%m-%d)
          if [ -n "${{ inputs.build_all }}" ]; then
            BUILD_ALL="${{ inputs.build_all }}"
          else
            BUILD_ALL="true"
          fi
          if [ "$BUILD_ALL" = "true" ]; then
            TARGETS='[{"target":"android","os":"ubuntu-latest"},{"target":"linux","os":"ubuntu-latest"},{"target":"linux-arm64","os":"ubuntu-24.04-arm","flutter":"git"},{"target":"windows","os":"windows-latest"},{"target":"windows-arm64","os":"windows-11-arm","flutter":"git"},{"target":"macos","os":"macos-latest","flutter_arch":"arm64"},{"target":"ios","os":"macos-latest","flutter_arch":"arm64"},{"target":"web","os":"ubuntu-latest"}]'
          else
            TARGETS='[{"target":"android","os":"ubuntu-latest"}]'
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"
          echo "build_all=$BUILD_ALL" >> "$GITHUB_OUTPUT"
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"

  verify-frontend:
    name: Verify frontend
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lcov curl xz-utils
          curl -fsSL --retry 3 -o /tmp/cog.tar.gz "https://github.com/cocogitto/cocogitto/releases/download/7.0.0/cocogitto-7.0.0-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/cog.tar.gz -C /tmp
          sudo install -m 755 /tmp/x86_64-unknown-linux-musl/cog /usr/local/bin/cog

      - name: Analyze
        run: |
          flutter config --no-analytics >/dev/null
          flutter pub get
          flutter analyze --no-pub

      - name: Check conventional commits
        run: cog check --from-latest-tag || cog check

      - name: Test with coverage gate
        run: |
          set -o pipefail
          flutter test --coverage --no-pub
          # Untestable in a headless VM: native webview adapters/dock, the
          # OAuth+network FxA transport, real file downloads, entrypoints.
          # Everything else is held at 100% line coverage.
          lcov --remove coverage/lcov.info \
            '**/*.g.dart' '**/*.freezed.dart' '**/l10n/**' \
            'lib/webview/*' 'lib/services/fxa.dart' 'lib/services/downloads.dart' \
            'lib/main.dart' 'lib/bootstrap_*.dart' \
            -o coverage/lcov.cleaned.info
          lcov --summary coverage/lcov.cleaned.info --fail-under-lines 90

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: [setup, verify-frontend]
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.setup.outputs.targets) }}
    env:
      VERSION: ${{ needs.setup.outputs.version }}
      BUILD_NUMBER: ${{ needs.setup.outputs.build_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (hosted)
        if: matrix.flutter != 'git'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          architecture: ${{ matrix.flutter_arch || 'x64' }}
          cache: true

      - name: Set up Flutter (git clone for arm runners)
        if: matrix.flutter == 'git'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ env.FLUTTER_VERSION }}" https://github.com/flutter/flutter.git "$HOME/flutter-sdk"
          echo "$HOME/flutter-sdk/bin" >> "$GITHUB_PATH"
          "$HOME/flutter-sdk/bin/flutter" --version
          "$HOME/flutter-sdk/bin/flutter" precache --linux || true
          "$HOME/flutter-sdk/bin/flutter" precache --web || true
          "$HOME/flutter-sdk/bin/flutter" precache --windows || true
          "$HOME/flutter-sdk/bin/flutter" precache --android || true

      - name: Setup Android signing
        id: signing
        if: matrix.target == 'android'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          if [ "${{ github.ref }}" != "refs/heads/main" ] && [[ ! "${{ github.ref }}" =~ ^refs/tags/ ]]; then
            echo "signing=debug" >> "$GITHUB_OUTPUT"
            echo "Non-main branch, using debug signing only"
            exit 0
          fi

          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_STORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "Missing Android signing configuration on a release build (main or tag). Refusing to ship a debug-signed artifact." >&2
            exit 1
          fi

          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > android/app/upload-keystore.jks 2>/dev/null; then
            echo "Keystore base64 is invalid on a release build (main or tag). Refusing to ship a debug-signed artifact." >&2
            exit 1
          fi

          if ! keytool -list -keystore android/app/upload-keystore.jks -storepass "$ANDROID_STORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "Keystore does not validate with the provided credentials on a release build (main or tag). Refusing to ship a debug-signed artifact." >&2
            exit 1
          fi

          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
            "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > android/app/key.properties
          echo "signing=release" >> "$GITHUB_OUTPUT"

      - name: Install Linux dependencies
        if: startsWith(matrix.target, 'linux')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev libblkid-dev liblzma-dev zip dpkg-dev rpm libwebkit2gtk-4.1-dev libsoup-3.0-dev curl

      - name: Build Android packages
        if: matrix.target == 'android'
        run: |
          set -euo pipefail
          ARTIFACTS_DIR="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$ARTIFACTS_DIR"
          flutter config --no-analytics >/dev/null
          flutter pub get
          flutter config --enable-android
          MR_DART_DEFINES=()
          if [ -n "${MERGE_REQUEST_ID:-}" ]; then
            MR_DART_DEFINES+=(--dart-define=MERGE_REQUEST_ID="$MERGE_REQUEST_ID")
            MR_DART_DEFINES+=(--dart-define=MERGE_REQUEST_URL="$MERGE_REQUEST_URL")
          fi
          if [ "${{ steps.signing.outputs.signing }}" = "release" ]; then
            flutter build apk --release --build-name="$VERSION" --build-number="$BUILD_NUMBER" "${MR_DART_DEFINES[@]+"${MR_DART_DEFINES[@]}"}"
            flutter build appbundle --release --build-name="$VERSION" --build-number="$BUILD_NUMBER" "${MR_DART_DEFINES[@]+"${MR_DART_DEFINES[@]}"}"
            cp build/app/outputs/flutter-apk/app-release.apk "$ARTIFACTS_DIR/wave-android.apk"
            cp build/app/outputs/bundle/release/app-release.aab "$ARTIFACTS_DIR/wave-android.aab"
          else
            flutter build apk --debug --build-name="$VERSION" --build-number="$BUILD_NUMBER" "${MR_DART_DEFINES[@]+"${MR_DART_DEFINES[@]}"}"
            flutter build appbundle --debug --build-name="$VERSION" --build-number="$BUILD_NUMBER" "${MR_DART_DEFINES[@]+"${MR_DART_DEFINES[@]}"}"
            cp build/app/outputs/flutter-apk/app-debug.apk "$ARTIFACTS_DIR/wave-android.apk"
            cp build/app/outputs/bundle/debug/app-debug.aab "$ARTIFACTS_DIR/wave-android.aab"
          fi

      - name: Build Linux desktop packages
        if: startsWith(matrix.target, 'linux')
        run: |
          set -euo pipefail
          ARTIFACTS_DIR="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$ARTIFACTS_DIR"
          flutter config --no-analytics >/dev/null
          flutter pub get
          flutter config --enable-linux-desktop
          MR_DART_DEFINES=()
          if [ -n "${MERGE_REQUEST_ID:-}" ]; then
            MR_DART_DEFINES+=(--dart-define=MERGE_REQUEST_ID="$MERGE_REQUEST_ID")
            MR_DART_DEFINES+=(--dart-define=MERGE_REQUEST_URL="$MERGE_REQUEST_URL")
          fi
          flutter build linux --release --build-name="$VERSION" --build-number="$BUILD_NUMBER" "${MR_DART_DEFINES[@]+"${MR_DART_DEFINES[@]}"}"
          if [ "${{ matrix.target }}" = "linux-arm64" ]; then
            LINUX_ARCH=arm64
            DEB_ARCH=arm64
            RPM_ARCH=aarch64
            OUT_ARCH=arm64
          else
            LINUX_ARCH=x64
            DEB_ARCH=amd64
            RPM_ARCH=x86_64
            OUT_ARCH=x86_64
          fi
          BUNDLE="build/linux/$LINUX_ARCH/release/bundle"
          tar -czf "$ARTIFACTS_DIR/wave-linux-$OUT_ARCH.tar.gz" -C "$BUNDLE" .
          (cd "$BUNDLE" && zip -r "$ARTIFACTS_DIR/wave-linux-$OUT_ARCH.zip" . >/dev/null)

          # .deb
          pkgdir="$GITHUB_WORKSPACE/wave-linux-$OUT_ARCH-deb"
          rm -rf "$pkgdir"
          mkdir -p "$pkgdir/opt/wave" "$pkgdir/usr/bin" "$pkgdir/usr/share/applications" \
            "$pkgdir/usr/share/icons/hicolor/512x512/apps" "$pkgdir/DEBIAN"
          cp -r "$BUNDLE/." "$pkgdir/opt/wave/"
          cp assets/icon-1024.png "$pkgdir/usr/share/icons/hicolor/512x512/apps/wave.png"
          ln -sf /opt/wave/wave "$pkgdir/usr/bin/wave"
          cat > "$pkgdir/usr/share/applications/wave.desktop" <<'DESKTOP'
          [Desktop Entry]
          Name=Wave
          Comment=A quiet browser
          Exec=/opt/wave/wave
          Icon=wave
          Terminal=false
          Type=Application
          Categories=Network;WebBrowser;
          MimeType=text/html;x-scheme-handler/http;x-scheme-handler/https;
          DESKTOP
          {
            echo "Package: wave"
            echo "Version: $VERSION"
            echo "Section: web"
            echo "Priority: optional"
            echo "Architecture: $DEB_ARCH"
            echo "Depends: libwebkit2gtk-4.1-0"
            echo "Maintainer: Wave CI <ci@gitlab.com>"
            echo "Description: A quiet browser — vertical tabs, workspaces, Firefox Accounts sync."
          } > "$pkgdir/DEBIAN/control"
          dpkg-deb --build "$pkgdir" "$ARTIFACTS_DIR/wave-linux-$OUT_ARCH.deb" >/dev/null
          rm -rf "$pkgdir"

          # .rpm
          ICON="$PWD/assets/icon-1024.png" ./scripts/build-rpm.sh "$BUNDLE" "$VERSION" "$RPM_ARCH" "$ARTIFACTS_DIR/wave-linux-$OUT_ARCH.rpm" "$BUILD_NUMBER"

          # AppImage
          curl -fsSL --retry 3 -o /tmp/appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-$(uname -m).AppImage"
          chmod +x /tmp/appimagetool
          appdir="$GITHUB_WORKSPACE/wave-$OUT_ARCH.AppDir"
          rm -rf "$appdir"
          mkdir -p "$appdir/usr/bin" "$appdir/usr/share/icons/hicolor/512x512/apps"
          cp -r "$BUNDLE/." "$appdir/usr/bin/"
          cp assets/icon-1024.png "$appdir/usr/share/icons/hicolor/512x512/apps/wave.png"
          cp assets/icon-1024.png "$appdir/wave.png"
          ln -sf usr/bin/wave "$appdir/AppRun"
          cat > "$appdir/wave.desktop" <<'DESKTOP'
          [Desktop Entry]
          Name=Wave
          Comment=A quiet browser
          Exec=wave
          Icon=wave
          Terminal=false
          Type=Application
          Categories=Network;WebBrowser;
          DESKTOP
          /tmp/appimagetool "$appdir" "$ARTIFACTS_DIR/wave-linux-$OUT_ARCH.AppImage" >/dev/null || {
            # appimagetool needs FUSE; fall back to --appimage-extract-and-run
            /tmp/appimagetool --appimage-extract-and-run "$appdir" "$ARTIFACTS_DIR/wave-linux-$OUT_ARCH.AppImage" >/dev/null || true
          }
          rm -rf "$appdir"

      - name: Build Windows package
        if: startsWith(matrix.target, 'windows')
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACTS_DIR="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$ARTIFACTS_DIR"
          flutter config --no-analytics >/dev/null
          flutter pub get
          flutter config --enable-windows-desktop
          MR_DART_DEFINES=()
          if [ -n "${MERGE_REQUEST_ID:-}" ]; then
            MR_DART_DEFINES+=(--dart-define=MERGE_REQUEST_ID="$MERGE_REQUEST_ID")
            MR_DART_DEFINES+=(--dart-define=MERGE_REQUEST_URL="$MERGE_REQUEST_URL")
          fi
          flutter build windows --release --build-name="$VERSION" --build-number="$BUILD_NUMBER" "${MR_DART_DEFINES[@]+"${MR_DART_DEFINES[@]}"}"
          if [ "${{ matrix.target }}" = "windows-arm64" ]; then
            WIN_ARCH=arm64
            OUT_ARCH=arm64
          else
            WIN_ARCH=x64
            OUT_ARCH=x86_64
          fi
          RELEASE_DIR="build/windows/$WIN_ARCH/runner/Release"
          if [ ! -d "$RELEASE_DIR" ]; then
            echo "Expected Windows build output at $RELEASE_DIR is missing" >&2
            exit 1
          fi
          powershell -NoProfile -Command \
            "Compress-Archive -Path '$(cygpath -w "$RELEASE_DIR")\\*' -DestinationPath '$(cygpath -w "$ARTIFACTS_DIR/wave-windows-$OUT_ARCH.zip")' -Force"

      - name: Build macOS package
        if: matrix.target == 'macos'
        run: |
          set -euo pipefail
          ARTIFACTS_DIR="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$ARTIFACTS_DIR"
          flutter config --no-analytics >/dev/null
          flutter pub get
          flutter config --enable-macos-desktop
          MR_DART_DEFINES=()
          if [ -n "${MERGE_REQUEST_ID:-}" ]; then
            MR_DART_DEFINES+=(--dart-define=MERGE_REQUEST_ID="$MERGE_REQUEST_ID")
            MR_DART_DEFINES+=(--dart-define=MERGE_REQUEST_URL="$MERGE_REQUEST_URL")
          fi
          flutter build macos --release --build-name="$VERSION" --build-number="$BUILD_NUMBER" "${MR_DART_DEFINES[@]+"${MR_DART_DEFINES[@]}"}"
          APP="build/macos/Build/Products/Release/Wave.app"
          codesign --force --deep --sign - "$APP" || true
          (cd "$(dirname "$APP")" && zip -r "$ARTIFACTS_DIR/wave-macos-arm64.zip" "Wave.app" >/dev/null)
          hdiutil create -volname "Wave" -srcfolder "$APP" -ov -format UDZO "$ARTIFACTS_DIR/wave-macos-arm64.dmg" >/dev/null

      - name: Build iOS package (unsigned)
        if: matrix.target == 'ios'
        run: |
          set -euo pipefail
          ARTIFACTS_DIR="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$ARTIFACTS_DIR"
          flutter config --no-analytics >/dev/null
          flutter pub get
          MR_DART_DEFINES=()
          if [ -n "${MERGE_REQUEST_ID:-}" ]; then
            MR_DART_DEFINES+=(--dart-define=MERGE_REQUEST_ID="$MERGE_REQUEST_ID")
            MR_DART_DEFINES+=(--dart-define=MERGE_REQUEST_URL="$MERGE_REQUEST_URL")
          fi
          flutter build ios --release --no-codesign --build-name="$VERSION" --build-number="$BUILD_NUMBER" "${MR_DART_DEFINES[@]+"${MR_DART_DEFINES[@]}"}"
          rm -rf Payload
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r "$ARTIFACTS_DIR/wave-ios-arm64-unsigned.ipa" Payload >/dev/null

      - name: Build web landing page
        if: matrix.target == 'web'
        run: |
          set -euo pipefail
          ARTIFACTS_DIR="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$ARTIFACTS_DIR"
          flutter config --no-analytics >/dev/null
          flutter pub get
          flutter config --enable-web
          flutter build web --release --build-name="$VERSION" --build-number="$BUILD_NUMBER"
          tar -czf "$ARTIFACTS_DIR/wave-web.tar.gz" -C build/web .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  nightly:
    name: Nightly release
    runs-on: ubuntu-latest
    needs: [setup, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.setup.outputs.build_all == 'true' && github.ref == 'refs/heads/main' && inputs.merge_request_id == '' && (github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.create_release == false || inputs.create_release == 'false'))) }}
    permissions:
      contents: write
    concurrency:
      group: release-ops
      cancel-in-progress: false
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine release tag
        id: meta
        run: echo "release_tag=nightly" >> "$GITHUB_OUTPUT"

      - name: Move nightly tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin nightly

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f -name 'wave*' -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Generate checksums
        working-directory: release-assets
        run: |
          sha256sum * > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: Delete existing nightly assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view nightly -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view nightly -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | while read -r asset; do
              [ -n "$asset" ] && gh release delete-asset nightly -R "$GITHUB_REPOSITORY" "$asset" --yes 2>/dev/null || true
            done
          fi

      - name: Update nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          body: |
            Automated nightly build from commit ${{ github.sha }}

            **Branch:** ${{ github.ref_name }}
            **Version:** ${{ needs.setup.outputs.version }}
            **Build:** #${{ github.run_number }}
          files: |
            release-assets/*
            SHA256SUMS.txt
          prerelease: true

  release:
    name: Tagged release
    runs-on: ubuntu-latest
    needs: [setup, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.create_release == true || inputs.create_release == 'true'))) }}
    permissions:
      contents: write
    concurrency:
      group: release-ops
      cancel-in-progress: false
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine release tag
        id: meta
        run: |
          if [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            echo "release_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            TAG="v${{ needs.setup.outputs.version }}"
            echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG" "$GITHUB_SHA" 2>/dev/null || true
            git push origin "$TAG" 2>/dev/null || true
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f -name 'wave*' -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * > ../SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: Wave ${{ steps.meta.outputs.release_tag }}
          generate_release_notes: true
          files: |
            release-assets/*
            SHA256SUMS.txt

  gitlab-sync:
    name: Trigger GitLab sync
    runs-on: ubuntu-latest
    needs: [nightly, release]
    if: always() && (needs.nightly.result == 'success' || needs.release.result == 'success')
    steps:
      - name: Determine release tag
        id: meta
        run: |
          if [ "${{ needs.release.result }}" = "success" ]; then
            echo "release_tag=${{ needs.release.outputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=${{ needs.nightly.outputs.release_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger GitLab sync pipeline
        run: |
          RELEASE_TAG="${{ steps.meta.outputs.release_tag }}"
          curl -fsSL --max-time 30 --retry 2 -X POST \
            -F token="${{ secrets.GITLAB_TRIGGER_TOKEN }}" \
            -F "ref=main" \
            -F "variables[GITHUB_RUN_ID]=${{ github.run_id }}" \
            -F "variables[RELEASE_TAG]=${RELEASE_TAG}" \
            "https://gitlab.com/api/v4/projects/${{ secrets.GITLAB_PROJECT_ID }}/trigger/pipeline"
